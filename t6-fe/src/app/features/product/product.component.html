<app-header></app-header>

<div class="product-page">

  <header class="page-header">
    <div class="page-header__text">
      <h1>Quản lý sản phẩm</h1>
      <p class="page-header__subtitle">
        Hiển thị <strong>{{ products().length }}</strong> / {{ totalElements() }} sản phẩm
      </p>
    </div>

    <button mat-raised-button color="primary" class="btn-create" (click)="openCreateForm()">
      <mat-icon>add</mat-icon>
      Tạo sản phẩm
    </button>

    <!-- <button
  mat-raised-button
  color="primary"
  type="button"
  (click)="loadProducts(currentPage())"
>
  <mat-icon>refresh</mat-icon>
  Tải lại sản phẩm
</button> -->
  </header>

  <section class="toolbar">
    <div class="search-box">
      <mat-icon class="search-box__icon">search</mat-icon>
<input
  type="text"
  placeholder="Tìm kiếm sản phẩm..."
  [value]="keyword()"
  (input)="onSearch($any($event.target).value)"
/>
      <button class="btn btn--primary" (click)="searchProducts(keyword())">
        Tìm kiếm
      </button>
    </div>

    <div class="action-box">
<button class="btn btn--ghost" (click)="clearSort()">
  <mat-icon>list</mat-icon>
  Tất cả
</button>
      <button class="btn btn--accent" (click)="syncProducts()">
        <mat-icon>sync</mat-icon>
        Đồng bộ
      </button>

          <button
  mat-stroked-button
  (click)="sortPriceAsc()"
>
  <mat-icon>sort</mat-icon>
  Giá tăng dần
</button>
    </div>
  </section>

  <main class="product-table-card">
    <div class="table-scroll">
      <table mat-table [dataSource]="products()" class="product-table">

        <!-- <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef>ID</th>
          <td mat-cell *matCellDef="let product">
            <span class="id-badge">#{{ product.id }}</span>
          </td>
        </ng-container> -->
        <ng-container matColumnDef="stt">
  <th mat-header-cell *matHeaderCellDef>STT</th>
  <td mat-cell *matCellDef="let product; let i = index">
    <span class="id-badge">{{ currentPage() * pageSize() + i + 1 }}</span>
  </td>
</ng-container>

        <ng-container matColumnDef="image">
          <th mat-header-cell *matHeaderCellDef>Ảnh</th>
          <td mat-cell *matCellDef="let product">
<img
  class="thumb"
  [src]="product.imageUrl || 'assets/images/meo.jpg'"
  [alt]="product.name"
/>
          </td>
        </ng-container>

        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Tên sản phẩm</th>
          <td mat-cell *matCellDef="let product">
            <button class="product-name" (click)="viewDetail(product.id)">
              {{ product.name }}
            </button>
          </td>
        </ng-container>

        <ng-container matColumnDef="price">
          <th mat-header-cell *matHeaderCellDef>Giá</th>
          <td mat-cell *matCellDef="let product">
            <span class="price">{{ product.price | number }} đ</span>
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="col-actions">Thao tác</th>
          <td mat-cell *matCellDef="let product" class="col-actions">
            <button
              mat-icon-button
              matTooltip="Xem chi tiết"
              (click)="viewDetail(product.id)"
            >
              <mat-icon>visibility</mat-icon>
            </button>
            <button
              mat-icon-button
              color="warn"
              matTooltip="Xóa sản phẩm"
              (click)="deleteProduct(product.id)"
            >
              <mat-icon>delete</mat-icon>
            </button>

                <button
      mat-icon-button
      color="warn"
      matTooltip="Xóa vĩnh viễn"
      (click)="openHardDeleteDialog(product)"
    >
      <mat-icon>delete_forever</mat-icon>
    </button>


          </td>
        </ng-container>
        

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        <tr class="mat-row" *matNoDataRow>
          <td class="empty-row" [attr.colspan]="displayedColumns.length">
            <mat-icon>inventory_2</mat-icon>
            <span>Không có sản phẩm nào.</span>
          </td>
        </tr>
      </table>
    </div>

    <mat-paginator
      [length]="totalElements()"
      [pageSize]="pageSize()"
      [pageIndex]="currentPage()"
      [pageSizeOptions]="[5, 10, 20, 50]"
      (page)="onPageChange($event)"
      showFirstLastButtons
    />
  </main>

  @if (showCreateForm()) {
    <app-product-form
      (saved)="onProductCreated()"
      (closed)="closeCreateForm()"
    />
  }

</div>
