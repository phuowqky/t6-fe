<header class="app-header">
  <div class="header-left">
    <mat-icon>inventory_2</mat-icon>
    <span>Product Management</span>
  </div>

  <nav class="header-actions">
    <button
      mat-button
      type="button"
      (click)="goToProducts()"
    >
      <mat-icon>list</mat-icon>

      mat-raised-button

      type="button"

      Thêm sản phẩm
    </button>
  </nav>
</header>
